version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://ai_user:password@db:5432/ai_analytics

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_analytics
    ports:
      - "5432:5432"